<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>M3 Countdown</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; }
  body {
    display: flex; align-items: center; justify-content: center;
    font-family: ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    color: #37352f;
  }
  @media (prefers-color-scheme: dark) { body { color: #e6e6e5; } }
  .wrap { text-align: center; }
  .label { font-size: 14px; opacity: .6; letter-spacing: .04em; margin-bottom: 8px; }
  .grid { display: flex; gap: 18px; justify-content: center; }
  .unit { min-width: 64px; }
  .num { font-size: 40px; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1; }
  .txt { font-size: 12px; opacity: .55; margin-top: 4px; }
  .done { font-size: 28px; font-weight: 600; }
</style>
</head>
<body>
<div class="wrap">
  <div class="label">⏳ BIS ZUM M3 · 17.12.2026, 00:00</div>
  <div class="grid" id="grid">
    <div class="unit"><div class="num" id="d">–</div><div class="txt">Tage</div></div>
    <div class="unit"><div class="num" id="h">–</div><div class="txt">Std</div></div>
    <div class="unit"><div class="num" id="m">–</div><div class="txt">Min</div></div>
    <div class="unit"><div class="num" id="s">–</div><div class="txt">Sek</div></div>
  </div>
</div>
<script>
  // Zielzeitpunkt: 17.12.2026 00:00 Londoner Zeit (= UTC im Winter).
  // Für deutsche Mitternacht stattdessen: "2026-12-17T00:00:00+01:00"
  const TARGET = new Date("2026-12-17T00:00:00Z").getTime();
  const pad = n => String(n).padStart(2, "0");
  function tick() {
    let diff = Math.floor((TARGET - Date.now()) / 1000);
    if (diff <= 0) {
      document.getElementById("grid").innerHTML =
        '<div class="done">Heute ist Prüfung – viel Erfolg! 🍀</div>';
      return;
    }
    const d = Math.floor(diff / 86400); diff %= 86400;
    const h = Math.floor(diff / 3600);  diff %= 3600;
    const m = Math.floor(diff / 60);    const s = diff % 60;
    document.getElementById("d").textContent = d;
    document.getElementById("h").textContent = pad(h);
    document.getElementById("m").textContent = pad(m);
    document.getElementById("s").textContent = pad(s);
    setTimeout(tick, 1000);
  }
  tick();
</script>
</body>
</html>
